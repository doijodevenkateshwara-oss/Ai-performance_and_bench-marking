[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-perf"
version = "0.1.0"
description = "Multi-layer LLM/agent performance testing framework built on Locust + OpenTelemetry"
requires-python = ">=3.10"
dependencies = [
    "locust>=2.24",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "requests>=2.31",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "boto3>=1.34",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpserver>=1.0",
    "respx>=0.21",
    "ruff>=0.5",
    "black>=24.0",
]
s3 = ["boto3"]
gcs = ["gcsfs>=2024.1"]
langchain = ["langchain>=0.3", "langchain-core>=0.3"]
llamaindex = ["llama-index>=0.11"]
alerts = []

[project.scripts]
llm-perf = "llm_perf.cli:app"

[tool.setuptools.packages.find]
include = ["llm_perf*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "RUF", "S", "TRY", "PL"]
ignore = [
    # load-test code deliberately isolates failures per request; broad excepts
    # are the error boundary and are converted into recorded errors
    "BLE001",
    "S110",   # try-except-pass in metric/logging paths (must never break a run)
    "S112",   # try-except-continue in SSE parsing (skip malformed chunks)
    "S104",   # binding 0.0.0.0 is intended for the metrics endpoint in containers
    "S311",   # random is fine for load shaping, not crypto
    # lazy imports are intentional: optional deps (boto3, grpc, locust) and
    # keeping CLI startup fast
    "PLC0415",
    # stylistic rules that don't improve correctness here
    "TRY003", "TRY004", "PLR2004", "PLR0911", "PLR0913", "PLR0917",
    "PLW0603", "B904", "S310", "E501", "PLR0912", "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B017", "S106", "S108"]
"llm_perf/cli.py" = ["B008"]

[tool.black]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
