[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-perf"
version = "0.1.0"
description = "Multi-layer LLM/agent performance testing framework built on Locust + OpenTelemetry"
requires-python = ">=3.10"
dependencies = [
    "locust>=2.24",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "requests>=2.31",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "boto3>=1.34",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpserver>=1.0",
    "respx>=0.21",
    "ruff>=0.5",
    "black>=24.0",
]
s3 = ["boto3"]
gcs = ["gcsfs>=2024.1"]
langchain = ["langchain>=0.3", "langchain-core>=0.3"]
llamaindex = ["llama-index>=0.11"]
alerts = []

[project.scripts]
llm-perf = "llm_perf.cli:app"

[tool.setuptools.packages.find]
include = ["llm_perf*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.black]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
