name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check llm_perf tests
      - name: Format check
        run: black --check llm_perf tests
      - name: Validate example configs
        run: |
          for f in configs/*.yaml; do llm-perf validate -c "$f"; done
      - name: Tests
        run: pytest -q
